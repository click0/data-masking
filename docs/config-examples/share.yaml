# ==========================================================================
# share — передача документа юристу, аналітику, іншому підрозділу
#
# Маскуються люди, їхні ідентифікатори та військові реквізити.
# Дати й номери наказів / БР лишаються як є: одержувачу потрібні
# хронологія подій і посилання на документи.
#
#   data-mask -i input.txt -o output.txt --config docs/config-examples/share.yaml
#
# Тут лише відмінності від значень за замовчуванням; повний перелік
# ключів з поясненнями — config_example.yaml.
# ==========================================================================

masking_rules:
  # Відкрито: хронологія і посилання на документи
  enable_dates: false
  enable_orders: false
  enable_br_numbers: false

  # Маскується (за замовчуванням і так увімкнено — тут для наочності)
  enable_names: true
  enable_ipn: true
  enable_passport: true
  enable_military_id: true
  enable_ranks: true
  enable_units: true
  enable_brigades: true

security:
  # Документ іде за межі вашого робочого місця — mapping (у ньому оригінали)
  # лишається у вас і лише зашифрованим. Пароль: $DATA_MASKING_PASSWORD
  # або згенерований (показується один раз — збережіть його).
  encrypt_output: true
