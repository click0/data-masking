# ==========================================================================
# Приклад конфігурації data-masking v3
#
# Скопіюйте як config.yaml (поточна директорія підхоплюється автоматично)
# або передайте явно:  data-mask -i input.txt --config my.yaml
# Згенерувати чисту конфігурацію:  data-mask --init-config
#
# Готові набори під типові сценарії — docs/config-examples/:
#   share.yaml   — передача документа: люди замасковані, дати й номери
#                  наказів лишаються (хронологія, посилання на документи)
#   strict.yaml  — передача назовні / в ШІ-сервіси: маскується все,
#                  прізвища повністю синтетичні, mapping лише шифрований
#   pii.yaml     — лише персональні дані; звання, в/ч, дати відкриті
#
# Пріоритет: прапорці CLI > змінні оточення > цей файл > значення за
# замовчуванням. Ключі, яких у файлі немає, беруться за замовчуванням —
# тому файл може містити лише те, що ви змінюєте. (./config.py, якщо є,
# використовується лише тоді, коли YAML-файлу немає.)
# Тут лише ключі, які програма справді читає; значення нижче — це
# значення за замовчуванням.
#
# Author: Vladyslav V. Prodan · github.com/click0
# License: BSD 3-Clause
# ==========================================================================

# --------------------------------------------------------------------------
# Що маскувати. Кожен прапорець вмикає/вимикає тип даних.
# CLI --only / --exclude (див. data-mask --list-types) мають пріоритет
# і на час запуску повністю замінюють ці прапорці.
# --------------------------------------------------------------------------
masking_rules:
  # Особи: прізвища, імена, по батькові, ПІБ з ініціалами.
  # Один перемикач на все ПІБ (окремо прізвища/імена не вимикаються).
  enable_names: true

  # Ідентифікатори
  enable_ipn: true            # ІПН / РНОКПП, 10 цифр
  enable_passport: true       # паспорт / ID-картка, 9 цифр
  enable_military_id: true    # військовий квиток: АА123456, мт-123456

  # Військові дані
  enable_ranks: true          # звання (з відмінками і родом)
  enable_units: true          # військові частини: А1234
  enable_brigades: true       # номери бригад: «72 окремої механізованої бригади»

  # Документи
  enable_orders: true         # номери наказів: №123, №45/67
  enable_br_numbers: true     # номери БР: 75/25/3400/Р, БР-123/456

  # Дати: і ДД.ММ.РРРР, і текстові («06» жовтня 2025 року).
  # Зсуваються детерміновано; вимкніть, якщо важлива хронологія.
  enable_dates: true

  # Скільки перших літер ОРИГІНАЛЬНОГО прізвища лишати в масці (0 = маска
  # повністю синтетична). Префікс разом зі збереженим закінченням ніколи не
  # перевищує половини прізвища: Коваль → Ков…, Іванов → І…ов,
  # Петренко → …енко (саме закінчення — вже половина слова).
  # ENV: DATA_MASKING_SURNAME_PREFIX_LENGTH
  surname_prefix_length: 3

# --------------------------------------------------------------------------
# Вигляд масок і детермінізм
# --------------------------------------------------------------------------
system:
  # Зберігати регістр: ІВАНОВ → ГРИЦЕНКО, Іванов → Гриценко.
  # ENV: DATA_MASKING_PRESERVE_CASE
  preserve_case: true

  # Словники faker для синтетичних прізвищ/імен: uk_UA, pl_PL, ru_RU, ...
  # Граматика (відмінки, рід, по батькові) лишається українською.
  # ENV: DATA_MASKING_FAKER_LOCALE
  faker_locale: "uk_UA"

  # Хеш для детермінованих масок: той самий оригінал → та сама маска.
  # Не змінюйте посеред роботи з пачкою документів — маски тих самих людей
  # у нових файлах стануть іншими. blake2b | sha256 | sha512 | sha1 | md5
  # ENV: DATA_MASKING_HASH_ALGORITHM
  hash_algorithm: "blake2b"

  # Детальний вивід (те саме, що --debug). Може показати фрагменти оригіналу —
  # лише для налагодження на тестових даних. ENV: DATA_MASKING_DEBUG
  debug_mode: false

# --------------------------------------------------------------------------
# Захист mapping-файлу (у ньому оригінали — бережіть його як документ)
# --------------------------------------------------------------------------
security:
  # Шифрувати mapping (те саме, що --encrypt): AES-256-GCM, ключ з пароля
  # через PBKDF2-HMAC-SHA256. Пишеться лише .enc, відкритий .json — ні.
  # Пароль: --password-env VAR → $DATA_MASKING_PASSWORD → інакше
  # генерується і показується ОДИН раз у stderr (збережіть його!).
  # Потребує пакета cryptography (pip install 'data-masking[full]').
  # ENV: DATA_MASKING_ENCRYPT_OUTPUT
  encrypt_output: false

  # Довжина згенерованого пароля. ENV: DATA_MASKING_PASSWORD_LENGTH
  password_length: 24

# --------------------------------------------------------------------------
# Вхідні файли
# --------------------------------------------------------------------------
validation:
  # Максимальний розмір вхідного файлу, МБ. ENV: DATA_MASKING_MAX_INPUT_SIZE_MB
  max_input_size_mb: 100

# --------------------------------------------------------------------------
# Логування (CLI --log-level / --log-file мають пріоритет)
# --------------------------------------------------------------------------
logging:
  # DEBUG | INFO | WARNING | ERROR | CRITICAL. ENV: DATA_MASKING_LOG_LEVEL
  level: "INFO"

  # Файл логу; null — лише консоль. ENV: DATA_MASKING_LOG_FILE
  # На рівні DEBUG у лог можуть потрапити фрагменти тексту — не вмикайте
  # його для бойових документів.
  file: null

# ==========================================================================
# Приклади запуску
# ==========================================================================
#
#  Маскування з цим файлом:
#    data-mask -i input.txt -o output.txt --config config_example.yaml
#
#  Набір для передачі документа:
#    data-mask -i input.txt -o output.txt --config docs/config-examples/share.yaml
#
#  Лише ІПН і звання (разово, без зміни файлу):
#    data-mask -i input.txt --only ipn,rank
#
#  Усе, крім дат:
#    data-mask -i input.txt --exclude dates
#
#  Шифрований mapping, пароль зі змінної оточення:
#    export DATA_MASKING_PASSWORD='…'
#    data-mask -i input.txt -o output.txt --encrypt
#
#  Повторне маскування (2 проходи):
#    data-mask -i input.txt -o output.txt --re-mask 2
#
#  Розмаскування (mapping шукається поруч автоматично або вказується):
#    data-unmask output.txt
#    data-unmask output.txt --map masking_map_….enc --password-env DATA_MASKING_PASSWORD
#
#  Без установки пакета: python data_masking.py … / python unmask_data.py …
#  Windows: data_masking.exe … / unmask_data.exe …
