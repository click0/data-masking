name: Release

# Як випустити реліз: Releases → «Draft a new release» → вибрати/створити тег
# vX.Y.Z (= datamasking/_version.py) → Publish. Опис можна лишити порожнім
# або згенерованим GitHub: пайплайн збере все, додасть файли й замінить опис
# текстом із CHANGELOG.md (усі записи після попереднього тегу). Текст,
# написаний у формі вручну, не перезаписується. Те саме — при `git push`
# тегу (реліз створює пайплайн). Dry-run: Actions → Release → Run workflow.

on:
  push:
    tags:
      - 'v*'
  # Dry-run: повна збірка без створення релізу; артефакти чіпляються
  # до workflow run. Дозволяє тестувати пайплайн з будь-якої гілки.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for the dry-run build'
        required: false
        default: 'pipeline test'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  # ---------------------------------------------------------------------
  # 1. Python-артефакти: тести, wheel+sdist, source-архіви
  # ---------------------------------------------------------------------
  build-python:
    name: Build Python artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install build twine

      - name: Run tests (release gate)
        run: pytest --timeout=300

      - name: Extract and verify version
        id: version
        run: |
          PKG_VER=$(python -c "exec(open('datamasking/_version.py').read()); print(__version__)")
          WRAPPER_VER=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"(.+?)\"', open('data_masking.py').read()).group(1))")
          test "$PKG_VER" = "$WRAPPER_VER" || { echo "datamasking._version $PKG_VER != data_masking.py $WRAPPER_VER"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VER=${GITHUB_REF_NAME#v}
            test "$TAG_VER" = "$PKG_VER" || { echo "Tag v$TAG_VER != source v$PKG_VER"; exit 1; }
          fi
          case "$PKG_VER" in
            *rc*|*beta*|*alpha*|*dev*) PRE=true ;;
            *) PRE=false ;;
          esac
          echo "version=$PKG_VER" >> $GITHUB_OUTPUT
          echo "prerelease=$PRE" >> $GITHUB_OUTPUT
          echo "Version verified: v$PKG_VER (prerelease=$PRE)"

      # Опис релізу — з CHANGELOG.md: усі записи після попереднього
      # релізного тегу до поточної версії. Падає, якщо запису для версії
      # немає (до публікації). У dry-run текст видно в summary прогону.
      - name: Generate release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "v${VERSION}" HEAD 2>/dev/null || echo "")
          echo "Previous release tag: ${PREV_TAG:-<none>}"
          python .github/scripts/release_notes.py \
            --version "$VERSION" ${PREV_TAG:+--since "$PREV_TAG"} \
            --repo "${GITHUB_REPOSITORY}" --output release-notes.md
          {
            echo "## Release notes preview — v${VERSION}"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 30

      - name: Build wheel and sdist
        run: |
          python -m build
          twine check dist/*

      - name: Build source archives
        run: |
          ARCHIVE="data-masking-${{ steps.version.outputs.version }}"
          FILES="data_masking.py unmask_data.py diagnose_mapping.py rank_data.py \
            __main__.py pyproject.toml MANIFEST.in pyinstaller_utf8_hook.py \
            config_example.py config_example.yaml config.yaml config_local.example.yaml \
            datamasking masking unmasking modules docs tests \
            requirements.txt requirements-dev.txt \
            LICENSE CHANGELOG.md pytest.ini mypy.ini .gitignore \
            input_example.txt input_example.2.txt"
          tar czf "dist/${ARCHIVE}.tar.gz" \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' \
            --transform="s,^,${ARCHIVE}/," $FILES
          zip -qr "dist/${ARCHIVE}.zip" $FILES -x '*__pycache__*' '*.pyc'
          ls -la dist/

      - name: Smoke test wheel install
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl
          # Нейтральний cwd: python -c додає '.' у sys.path, і з кореня
          # checkout find_spec бачив би shim-и репозиторію, а не wheel
          cd /tmp
          /tmp/wheeltest/bin/data-mask --version
          /tmp/wheeltest/bin/data-unmask --version
          /tmp/wheeltest/bin/data-masking-diagnose --help > /dev/null
          /tmp/wheeltest/bin/python -m datamasking --version
          /tmp/wheeltest/bin/python -c "
          import importlib.util
          for name in ('modules', 'rank_data', 'masking', 'unmasking'):
              assert importlib.util.find_spec(name) is None, f'{name} leaked into the wheel!'
          print('Wheel contents OK: only datamasking is installed')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/

  # ---------------------------------------------------------------------
  # 2. Windows exe — паралельно з python-артефактами
  # ---------------------------------------------------------------------
  build-windows:
    name: Build Windows binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Extract version
        shell: bash
        run: |
          VERSION=$(python -c "exec(open('datamasking/_version.py').read()); print(__version__)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build data_masking.exe
        shell: bash
        run: |
          pyinstaller --onefile --noconfirm --clean \
            --paths=. \
            --runtime-hook=pyinstaller_utf8_hook.py \
            --collect-all=faker \
            --collect-all=cryptography \
            --hidden-import=datamasking \
            --hidden-import=datamasking._version \
            --hidden-import=datamasking._fsutil \
            --hidden-import=datamasking.rank_data \
            --hidden-import=datamasking.masking \
            --hidden-import=datamasking.masking.constants \
            --hidden-import=datamasking.masking.helpers \
            --hidden-import=datamasking.masking.language \
            --hidden-import=datamasking.masking.context \
            --hidden-import=datamasking.masking.surname \
            --hidden-import=datamasking.masking.mask_personal \
            --hidden-import=datamasking.masking.mask_military \
            --hidden-import=datamasking.masking.engine \
            --hidden-import=datamasking.masking.cli \
            --hidden-import=datamasking.extras \
            --hidden-import=datamasking.extras.config \
            --hidden-import=datamasking.extras.security \
            --hidden-import=datamasking.extras.masking_logger \
            --hidden-import=datamasking.extras.selective \
            --hidden-import=datamasking.extras.re_mask \
            --hidden-import=datamasking.extras.password_generator \
            --hidden-import=yaml \
            --hidden-import=_cffi_backend \
            --name data_masking \
            data_masking.py

      - name: Build unmask_data.exe
        shell: bash
        run: |
          pyinstaller --onefile --noconfirm --clean \
            --paths=. \
            --runtime-hook=pyinstaller_utf8_hook.py \
            --collect-all=cryptography \
            --hidden-import=datamasking \
            --hidden-import=datamasking._version \
            --hidden-import=datamasking._fsutil \
            --hidden-import=datamasking.rank_data \
            --hidden-import=datamasking.unmasking \
            --hidden-import=datamasking.unmasking.helpers \
            --hidden-import=datamasking.unmasking.engine \
            --hidden-import=datamasking.unmasking.io \
            --hidden-import=datamasking.unmasking.cli \
            --hidden-import=datamasking.extras \
            --hidden-import=datamasking.extras.config \
            --hidden-import=datamasking.extras.security \
            --hidden-import=datamasking.extras.masking_logger \
            --hidden-import=datamasking.extras.re_mask \
            --hidden-import=datamasking.extras.rank_data \
            --hidden-import=yaml \
            --hidden-import=_cffi_backend \
            --name unmask_data \
            unmask_data.py

      - name: Build diagnose_mapping.exe
        shell: bash
        run: |
          pyinstaller --onefile --noconfirm --clean \
            --paths=. \
            --runtime-hook=pyinstaller_utf8_hook.py \
            --hidden-import=datamasking.diagnose \
            --name diagnose_mapping \
            diagnose_mapping.py

      - name: Smoke test
        shell: pwsh
        run: |
          ./dist/data_masking.exe --help
          ./dist/unmask_data.exe --help
          ./dist/diagnose_mapping.exe --help

      - name: Roundtrip test (mask -> unmask, plain and encrypted)
        shell: pwsh
        run: |
          ./dist/data_masking.exe -i input_example.txt -o masked.txt --no-report
          $map = Get-ChildItem masking_map_*.json | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (Select-String -Path masked.txt -Pattern '1234567890' -Quiet) { throw "IPN not masked in output" }
          ./dist/unmask_data.exe masked.txt --map $map.FullName -o recovered.txt
          if (!(Select-String -Path recovered.txt -Pattern '1234567890' -Quiet)) { throw "IPN not restored after unmask" }
          # Шифрований mapping: лише .enc, і він читається назад
          $env:DATA_MASKING_PASSWORD = "ci-pass-1"
          ./dist/data_masking.exe -i input_example.txt -o masked2.txt --no-report --encrypt
          if (Get-ChildItem masking_map_*.json | Where-Object { $_.LastWriteTime -gt $map.LastWriteTime }) { throw "plaintext mapping written with --encrypt" }
          $enc = Get-ChildItem masking_map_*.enc | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          ./dist/unmask_data.exe masked2.txt --map $enc.FullName -o recovered2.txt
          if (!(Select-String -Path recovered2.txt -Pattern '1234567890' -Quiet)) { throw "encrypted roundtrip failed" }

      - name: Package Windows binaries
        shell: bash
        run: |
          # Спільний config.yaml (усі ключі + переліки виключень) і шаблон
          # приватного config_local.yaml — поруч з exe
          cp config.yaml config_local.example.yaml dist/
          cd dist
          7z a "data-masking-${VERSION}-windows-x64.zip" \
            data_masking.exe unmask_data.exe diagnose_mapping.exe \
            config.yaml config_local.example.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/data-masking-*-windows-x64.zip

  # ---------------------------------------------------------------------
  # 3. Публікація — лише за тегом і лише коли ОБИДВІ збірки успішні
  #    (раніше реліз створювався ДО Windows-збірки, і її падіння лишало
  #    реліз без exe, на який вказує INSTALL.md)
  # ---------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [build-python, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # атестація походження (OIDC цього прогону)
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist-python
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      # Рівно ті файли, що йдуть у реліз; бракує хоч одного — стоп
      - name: Collect release files and SHA256SUMS
        env:
          VERSION: ${{ needs.build-python.outputs.version }}
        run: |
          mkdir release
          for f in "data-masking-${VERSION}.tar.gz" "data-masking-${VERSION}.zip" \
                   "data-masking-${VERSION}-windows-x64.zip"; do
            test -f "dist/$f" || { echo "::error::missing release file $f"; ls -la dist; exit 1; }
            cp "dist/$f" release/
          done
          # Ім'я wheel/sdist нормалізує setuptools (3.2.0-beta → 3.2.0b0) — беремо за шаблоном
          for pat in "dist/data_masking-*-py3-none-any.whl" "dist/data_masking-*.tar.gz"; do
            set -- $pat
            test -f "$1" || { echo "::error::missing release file $pat"; ls -la dist; exit 1; }
            cp "$1" release/
          done
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Атестація GitHub: який коміт, workflow і runner зібрали кожен файл.
      # Перевірка: gh attestation verify <файл> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/data*

      # Новий реліз збирається як чернетка і публікується, лише коли має
      # УСІ файли. Реліз, створений у формі GitHub (тег вибрано там), —
      # доповнюється: файли додаються, опис замінюється, лише якщо він
      # порожній або згенерований (GitHub чи цим пайплайном), назва — лише
      # якщо порожня. Текст, написаний вручну, лишається.
      - name: Create or complete GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-python.outputs.version }}
          PRERELEASE: ${{ needs.build-python.outputs.prerelease }}
        run: |
          TAG="${{ github.ref_name }}"
          TITLE="Data Masking System v${VERSION}"
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          WANT=$(ls release | wc -l)

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG exists: completing it"
            gh release view "$TAG" --json body --jq .body > /tmp/current-body.md
            CUR_TITLE=$(gh release view "$TAG" --json name --jq .name)
            EDIT=()
            if python3 .github/scripts/release_notes.py --check-replaceable /tmp/current-body.md; then
              echo "Description is empty/generated: using CHANGELOG notes"
              EDIT+=(--notes-file notes/release-notes.md)
            else
              echo "::notice::Release description was written by hand; keeping it"
            fi
            if [ -z "$CUR_TITLE" ] || [ "$CUR_TITLE" = "$TAG" ]; then
              EDIT+=(--title "$TITLE")
            fi
            OK=true
            gh release upload "$TAG" release/* --clobber || OK=false
            if $OK && { [ ${#EDIT[@]} -gt 0 ] || [ -n "$FLAGS" ]; }; then
              gh release edit "$TAG" "${EDIT[@]}" $FLAGS || OK=false
            fi
            if ! $OK; then
              echo "::error::The existing release $TAG could not be completed."
              echo "::error::With release immutability on (Settings → General → Releases) a published"
              echo "::error::release is frozen. Delete the release (the tag can stay) and re-run this workflow."
              exit 1
            fi
          else
            echo "Creating $TAG as a draft with every file"
            gh release create "$TAG" release/* --draft \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes-file notes/release-notes.md $FLAGS
          fi

          HAVE=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$HAVE" -lt "$WANT" ]; then
            echo "::error::release has $HAVE of $WANT files; not publishing an incomplete release"
            gh release view "$TAG" --json assets --jq '.assets[].name'
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json name,isDraft,isPrerelease,assets \
            --jq '"published \(.name) (draft=\(.isDraft) prerelease=\(.isPrerelease)) with \(.assets | length) file(s): " + (.assets | map(.name) | join(", "))'
