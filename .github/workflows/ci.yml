name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: '1'

jobs:
  lint:
    name: Syntax & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax check
        run: |
          python -m py_compile data_masking.py unmask_data.py diagnose_mapping.py rank_data.py __main__.py
          python -m compileall datamasking/ modules/ masking/ unmasking/ tests/ -q

      - name: Install flake8
        run: pip install flake8

      - name: Flake8 — fatal errors (syntax, undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Flake8 — warnings (non-blocking)
        run: flake8 . --count --max-line-length=150 --extend-ignore=E501,W503,W504 --statistics --exit-zero

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.11', '3.13']
        include:
          # Windows — ціль релізу (PyInstaller exe), тому тести мають
          # проходити й там, а не лише збиратись
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install package with all extras (editable) + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[full]'
          pip install -r requirements-dev.txt

      - name: Console scripts and module entry point
        run: |
          data-mask --version
          data-unmask --version
          data-masking-diagnose --help
          python -m datamasking --version

      - name: Run tests
        run: pytest --cov=datamasking --cov-report=term --cov-report=xml:coverage.xml --timeout=300

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  test-core-only:
    name: Tests (core install — no cryptography/pyyaml)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install core only (faker) + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout
          python -c "import cryptography" 2>/dev/null && exit 1 || echo "cryptography absent — OK"
          python -c "import yaml" 2>/dev/null && exit 1 || echo "pyyaml absent — OK"

      - name: Run tests (encryption/YAML tests must skip, not fail)
        run: pytest --timeout=300 -q

      - name: --encrypt degrades with a clean error (no traceback)
        run: |
          cp input_example.txt /tmp/in.txt
          cd /tmp
          set +e
          data-mask -i in.txt -o out.txt --encrypt --password x > out.log 2>&1
          rc=$?
          set -e
          cat out.log
          test $rc -ne 0
          ! grep -q Traceback out.log

  package:
    name: Build wheel/sdist & smoke-install
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: sdist is testable after extraction
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          python -m venv .venv && . .venv/bin/activate
          pip install -q '.[full]' pytest pytest-timeout
          pytest -q --timeout=300 -p no:cacheprovider

      - name: Wheel contains only the datamasking package
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          top = {n.split("/")[0] for n in names}
          leaked = {t for t in top if t in ("modules", "masking", "unmasking", "rank_data.py", "tests")}
          assert not leaked, f"leaked into wheel: {leaked}"
          print("wheel top-level:", sorted(top))
          EOF

  mypy:
    # Blocking з 3.0.7: 0 помилок; нові «може бути None» ловляться до мержу
    name: mypy (static types)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install mypy types-PyYAML faker cryptography pyyaml
          mypy datamasking/ --config-file mypy.ini
