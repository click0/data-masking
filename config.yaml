# ==========================================================================
# Конфігурація системи маскування даних
#
# Цей файл програма читає автоматично, якщо запускати її з цієї директорії
# (або вказати --config config.yaml). Тут — усі ключі з поточними
# значеннями за замовчуванням і повні переліки виключень (dictionaries):
# спільні налаштування, які комітяться в репозиторій.
#
# Приватні налаштування — у config_local.yaml поруч (у .gitignore; шаблон —
# config_local.example.yaml) та/або в теці користувача
# (~/.config/data-masking/, %APPDATA%\data-masking\). Кожен ключ зі
# значенням, відмінним від null, перекриває значення з цього файлу (списки —
# цілком). Пріоритет:
#   CLI > ENV > config_local.yaml > config.yaml > config.py > за замовчуванням
#
# Довідник з усіма поясненнями — config_example.yaml (дані ті самі).
#
# Author: Vladyslav V. Prodan
# Contact: github.com/click0
# Phone: +38(099)6053340
# Version: 2.6.0
# License: BSD 3-Clause "New" or "Revised" License
# Year: 2025-2026
# ==========================================================================

# --------------------------------------------------------------------------
# Системні налаштування
# --------------------------------------------------------------------------
system:
  # Версія конфігурації (для сумісності)
  version: "v2.6.0"

  # Алгоритм хешування для детерміністичного маскування.
  # Той самий вхід завжди дає той самий замаскований результат.
  # Доступні варіанти: blake2b (рекомендовано), md5, sha1, sha256, sha512
  hash_algorithm: "blake2b"

  # Мова синтетичних імен і по батькові (Faker): uk_UA, ru_RU, en_US …
  # Інша мова змінює маски імен
  faker_locale: "uk_UA"

  # Розмір дайджесту хешу (у байтах, 1–64; лише для blake2b).
  # Будь-яке значення, крім 64, змінює ВСІ маски
  hash_digest_size: 64

  # Кодування вхідних файлів (за замовчуванням UTF-8): utf-8 | cp1251 | ... |
  # auto (перше з validation.allowed_encodings, що прочитає файл).
  # Вихід пишеться тим самим кодуванням, unmask підхоплює його з mapping
  encoding: "utf-8"

  # Зберігати регістр літер замаскованих значень:
  #   ВЕЛИКІ ЛІТЕРИ  -> ВЕЛИКІ ЛІТЕРИ
  #   Кожне Слово    -> Кожне Слово
  #   малі літери    -> малі літери
  preserve_case: true

  # Резервна копія наявного ВИХІДНОГО файлу перед перезаписом (--force):
  # <файл><backup_suffix>. Вхідний файл програма не змінює.
  backup_enabled: false
  backup_suffix: ".bak"

  # Максимальний розмір файлу для обробки (МБ); діє менший із цього
  # і validation.max_input_size_mb
  max_file_size_mb: 100

  # Тимчасова директорія (порожнє = системна за замовчуванням)
  temp_dir: ""

  # Режим налагодження (детальний вивід у консоль)
  debug_mode: false

  # Строгий режим — зупиняє обробку при будь-якій помилці
  strict_mode: false

# --------------------------------------------------------------------------
# Налаштування безпеки та шифрування
# --------------------------------------------------------------------------
security:
  # Шифрувати файл маппінгу (AES-256-GCM)
  encrypt_output: false

  # Змінна оточення для зчитування пароля (альтернатива --password)
  password_env_var: "DATA_MASKING_PASSWORD"

  # Налаштування автоматичної генерації пароля
  password_generation:
    # Увімкнути автоматичну генерацію пароля
    enabled: true
    # Довжина пароля (символів)
    length: 24
    # Використовувати спеціальні символи (!@#$%^&*)
    use_special_chars: true
    # Алгоритм генерації: secrets (рекомендовано) або random
    algorithm: "secrets"
    # Мінімальна кількість великих літер
    min_uppercase: 2
    # Мінімальна кількість малих літер
    min_lowercase: 2
    # Мінімальна кількість цифр
    min_digits: 2
    # Мінімальна кількість спецсимволів
    min_special: 2

  # Алгоритм шифрування
  encryption_algorithm: "AES-256-GCM"

  # Деривація ключа з пароля: pbkdf2 (файл .enc читають усі версії) або
  # scrypt (стійкіший до підбору, але .enc читають лише v3.0.29+).
  # scrypt_n/r/p — параметри scrypt; salt_length — довжина солі, байт
  key_derivation: "pbkdf2"
  scrypt_n: 16384
  scrypt_r: 8
  scrypt_p: 1
  salt_length: 16

  # Автоматично генерувати пароль, якщо --password не вказано
  auto_generate_password: true

  # Файл для збереження згенерованого пароля (порожнє = не зберігати)
  password_file: ""

  # Безпечне видалення тимчасових файлів
  secure_delete_temp: true

# --------------------------------------------------------------------------
# Правила маскування — увімкнути/вимкнути окремі типи даних
# --------------------------------------------------------------------------
masking_rules:
  # Маска прізвища починається з перших літер оригіналу: не більше
  # surname_prefix_length, і разом зі збереженим закінченням — не більше
  # половини прізвища, але не менше surname_prefix_min:
  #   Коваль → Ков…, Іванов → І…ов, Петренко → П…енко (за «половиною» було б 0)
  # surname_prefix_length: 0 — прізвище повністю синтетичне;
  # surname_prefix_min: 0 — як до 3.1.4 (прізвища на «-енко» без жодної літери)
  surname_prefix_length: 3
  surname_prefix_min: 1

  # Військові звання (з відмінюванням та збереженням регістру)
  enable_ranks: true

  # Імена (перше ім'я)
  enable_names: true

  # Прізвища
  enable_surnames: true

  # По батькові
  enable_patronymics: true

  # Індивідуальний податковий номер / ІПН (10 цифр)
  enable_ipn: true

  # Паспорт та ID-картка (9 цифр)
  enable_passport: true

  # Військовий квиток (формат АА123456)
  enable_military_id: true

  # Дати у форматі ДД.ММ.РРРР (зсув ±30 днів)
  enable_dates: true

  # Текстові дати ("06" жовтня 2025 року)
  enable_date_text: true

  # Військові частини (наприклад, А1234)
  enable_units: true

  # Номери бригад (наприклад, "72 окремої механізованої бригади")
  enable_brigades: true

  # Номери наказів (наприклад, №123, №45/67)
  enable_orders: true

  # Номери БР-документів (наприклад, №БР-123/456)
  enable_br_numbers: true

  # Номери документів
  enable_document_numbers: true

  # Зберігати регістр при маскуванні
  preserve_case: true

  # Зберігати стать при підборі замін; false — рід маски імені й по батькові
  # псевдовипадковий (закінчення прізвищ, жіночі звання й дієслова стать видають)
  preserve_gender: true

  # Послідовне маскування (однакові значення -> однакова заміна).
  # Це незмінна поведінка: лише true (false — помилка конфігурації)
  consistent_mapping: true 

  # Відстеження instances: unmask відновлює кожне входження за номером (лише true)
  instance_tracking: true 

  # Контекстно-залежне маскування: ПІБ і звання розпізнаються за контекстом
  # (лише true; щоб не маскувати їх — enable_names / enable_ranks)
  context_aware: true 

  # Виправлення розірваних звань через перенос рядка (Fix #20)
  rank_line_break_fix: true

  # Власні шаблони регулярних виразів (додатково): рядок-regex або
  #   - pattern: "посвідчення\\s+(\\d{6})"   # група 1 — що саме маскувати
  #     name: id_card
  #     action: mask                        # mask | skip | warn
  # mask — маска тієї ж форми (цифри → цифри, літери → літери), unmask відновлює
  custom_patterns: []

# --------------------------------------------------------------------------
# Налаштування валідації
# --------------------------------------------------------------------------
validation:
  # Строгий режим (як system.strict_mode): попередження конфігурації — помилки
  strict_mode: false

  # Максимальний розмір вхідного файлу (МБ); діє менший із цього і
  # system.max_file_size_mb
  max_input_size_mb: 100

  # Кодування для system.encoding: auto (перше, яким читається файл)
  allowed_encodings:
    - "utf-8"
    - "cp1251"
    - "latin-1"

  # Маска ІПН з коректною контрольною цифрою (якщо в оригіналі вона
  # коректна). Змінює маски ІПН
  validate_ipn_checksum: false

  # Перевіряти діапазон дат
  validate_date_range: true
  min_date_year: 1900
  max_date_year: 2100

  # Звання розпізнаються за вбудованим словником (лише true;
  # щоб не маскувати їх — masking_rules.enable_ranks: false)
  validate_rank_dictionary: true 

  # Строгий формат ПІБ (Прізвище Ім'я По батькові)
  strict_pib_format: false

  # Дозволити скорочене по батькові (І.І.)
  allow_abbreviated_patronymic: true

  # Обмеження довжини імен
  max_name_length: 50
  min_name_length: 3

# --------------------------------------------------------------------------
# Правила маршрутизації (порядок обробки та вибіркове маскування)
# --------------------------------------------------------------------------
router_rules:
  # Дія за замовчуванням для власних шаблонів (custom_patterns), у яких
  # action не вказано: mask | skip (не чіпати) | warn (не чіпати + попередження)
  default_action: "mask"

  # Порядок обробки шаблонних типів: при перекритті перемагає раніший.
  # Типи, яких немає в списку, додаються в типовому порядку (нижче — він).
  # rank і pib розбирають рядок цілком і завжди йдуть після решти.
  # custom — власні шаблони (masking_rules.custom_patterns)
  processing_order:
    - "custom"
    - "order_number"
    - "br_number"
    - "ipn"
    - "passport_id"
    - "military_id"
    - "military_unit"
    - "brigade_number"
    - "date"
    - "date_text"
    - "rank"
    - "pib"

  # Пропустити вказані типи (має пріоритет над processing_order)
  # Приклад: skip_types: ["date", "ipn"]
  skip_types: []

  # Маскувати ТІЛЬКИ вказані типи (решта пропускається)
  # Приклад: only_types: ["ipn", "rank"]
  only_types: []

  # Перевизначення пріоритетів (ключ: тип, значення: число; менше — раніше;
  # без перевизначення пріоритет = позиція в processing_order: 0, 1, 2 …)
  priority_overrides: {}

# --------------------------------------------------------------------------
# Налаштування логування
# --------------------------------------------------------------------------
logging:
  # Увімкнути логування
  enabled: true

  # Рівень логування: DEBUG | INFO | WARNING | ERROR | CRITICAL
  level: "INFO"

  # Шлях до файлу логу (null = тільки консоль)
  file: null

  # Формат повідомлень логу (Python logging format)
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # Максимальний розмір файлу логу (МБ)
  max_log_size_mb: 10

  # Кількість ротаційних файлів логу
  log_rotation_count: 5

  # Виводити логи у консоль
  log_to_console: true

  # Записувати логи у файл
  log_to_file: false

  # НЕ логувати чутливі дані (завжди false у продакшені!)
  log_sensitive_data: false

  # Логувати продуктивність (час обробки)
  log_performance: false

  # Логувати статистику маскування
  log_statistics: true

# --------------------------------------------------------------------------
# Налаштування повторного маскування (re-mask)
# --------------------------------------------------------------------------
remask:
  # Увімкнути підтримку багатопрохідного маскування
  enabled: true

  # Максимальна кількість проходів
  max_passes: 10

  # Зберігати ланцюг маппінгів для відновлення: у режимі --re-mask файл
  # ланцюга і є маппінгом (лише true)
  save_chain: true 

  # Формат файлу ланцюга
  chain_format: "json"

  # Автоматично нумерувати проходи — на цьому тримається --to-version (лише true)
  auto_numbering: true 

# --------------------------------------------------------------------------
# Виключення — доповнюють вбудовані переліки (masking/exclusions.py;
# подивитися діючі: python data_masking.py --list-exclusions).
# «*» у кінці слова — будь-яке закінчення: "Верховн* Рад*". Регістр не
# враховується. Приватні слова краще тримати в config_local.yaml.
# --------------------------------------------------------------------------
exclusions:
  # Абревіатури, які не маскуються як прізвище (до вбудованих ЗСУ, МОУ, ВСУ,
  # ДПСУ, НГУ, ДСНС, СБУ, ГУР, ТЦК, СП, КМУ, ОТЦКСП)
  abbreviations: []

  # Слова, які не вважаються частиною ПІБ (по одному слову; відмінки — окремо)
  words: []

  # Фрази, які не маскуються взагалі, напр. ["Верховн* Рад*"]
  phrases: []

  # Нормативні акти: назва не маскується, дата після «<акт> … від» не
  # зсувається, напр. ["розпорядженн* президента"]
  legal_acts: []

  # Слова/фрази, які маскуються завжди (маска тієї ж форми, unmask
  # відновлює), напр. позивні: ["Грім", "Сокіл"]
  always_mask: []

  # Прибрати вбудовані слова / абревіатури / акти, напр. ["Положення"]
  remove: []

# --------------------------------------------------------------------------
# Переліки виключень — повні, їх можна редагувати (раніше були лише в коді).
# Відсутній ключ або null — вбудована копія з програми
# (datamasking/masking/exclusions.py). Доповнювати приватно краще не тут, а
# в config_local.yaml через секцію exclusions (там списки додаються).
#   abbreviations  — абревіатури, які не маскуються як прізвище
#   non_name_words — слова, які не є частиною ПІБ (кожен відмінок — окремо)
#   legal_acts     — нормативні акти: дата після «<акт> … від» не зсувається;
#                    «*» у кінці слова — будь-яке закінчення
# Діючі переліки: python data_masking.py --list-exclusions
# --------------------------------------------------------------------------
dictionaries:
  abbreviations: [
    "зсу", "моу", "всу", "дпсу", "нгу", "дснс", "сбу", "гур", "тцк", "сп", "кму", "отцксп"
  ]
  non_name_words: [
    "Дійсним", "дійсним", "Відповідно", "відповідно", "Згідно", "згідно",
    "Відповідальний", "відповідальний", "Командир", "командир", "командира", "Начальник",
    "начальник", "Заступник", "заступник", "Виконуючий", "виконуючий", "обов'язки",
    "обав'язки", "доповідаю", "прошу", "наказую", "призначити", "звільнити",
    "проявив", "виконав", "оголосити", "оголосити", "про", "по",
    "від", "до", "за", "суті", "мною", "Вас",
    "вас", "Вам", "вам", "Вами", "вами", "Ваш",
    "ваш", "Ваша", "ваша", "Ваше", "ваше", "Повідомляємо",
    "повідомляємо", "Просимо", "просимо", "Направляємо", "направляємо", "Надаємо",
    "надаємо", "зв'язку", "порушення", "вимог", "Збройних", "збройних",
    "України", "україни", "служби", "Служби", "військової", "Військової",
    "частини", "Частини", "взводу", "Взводу", "батальйону", "Батальйону",
    "роти", "Роти", "Статуту", "статуту", "Указу", "указу",
    "Закону", "закону", "Кодексу", "кодексу", "Положення", "положення",
    "Інструкції", "інструкції", "наказу", "Наказу", "наказом", "Наказом",
    "рапорту", "Рапорту", "статей", "Статей", "пункту", "Пункту",
    "неналежііе", "инутрішньої", "радіовіzUділення", "с~гатуту", "року", "Року",
    "числа", "місяця", "один", "два", "три", "чотири",
    "п'ять", "ПІБ", "піб", "Піб", "звання", "Звання",
    "ЗВАННЯ", "ІПН", "іпн", "Іпн", "РНОКПП", "паспорт",
    "Паспорт", "Кабінет", "Кабінету", "Кабінетові", "Кабінетом", "Кабінеті",
    "Кабінете", "Міністрів"
  ]
  legal_acts: [
    "закон*", "кодекс*", "конституці*", "указ* президента",
    "постанов* кабінету міністрів", "постанов* верховної ради", "постанов* кму", "постанов* кмy"
  ]

# ==========================================================================
# Приклади використання
# ==========================================================================
#
# 1. Базове маскування:
#    python data_masking.py -i input.txt -o output.txt
#
# 2. Маскування з конфігурацією:
#    python data_masking.py -i input.txt -o output.txt --config config.yaml
#
# 3. Генерація конфігурації за замовчуванням:
#    python data_masking.py --init-config
#
# 4. Маскування з шифруванням:
#    python data_masking.py -i input.txt -o output.txt --encrypt --password "MyPass123"
#
# 5. Вибіркове маскування (тільки ІПН та звання):
#    python data_masking.py -i input.txt -o output.txt --only ipn,rank
#
# 6. Маскування з виключенням дат:
#    python data_masking.py -i input.txt -o output.txt --exclude date,date_text
#
# 7. Повторне маскування (2 проходи):
#    python data_masking.py -i input.txt -o output.txt --re-mask 2
#
# 8. Діагностика маппінгу:
#    python diagnose_mapping.py mapping.json --verify input.txt output.txt
#
# 9. Розмаскування:
#    python unmask_data.py -i masked.txt -m mapping.json -o restored.txt
#
# 10. Пароль через змінну оточення:
#     export DATA_MASKING_PASSWORD="MySecurePassword"
#     python data_masking.py -i input.txt -o output.txt --encrypt
#
# 11. Приватні перекриття з іншого файлу / без них:
#     python data_masking.py -i input.txt -o output.txt --config-local private.yaml
#     python data_masking.py -i input.txt -o output.txt --no-local-config
#
# 12. Діючі виключення (вбудовані + конфігурація):
#     python data_masking.py --list-exclusions
